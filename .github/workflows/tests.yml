name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest

      # Guards the Track A -> Track C hand-off. If the ground-truth files are
      # regenerated in a shape the adapter cannot read, this fails here rather
      # than in October when someone is trying to produce the headline figure.
      - name: Verify ground truth still converts
        run: python -m src.data.ground_truth

      # Proves the full ladder plumbing runs end to end without any real data,
      # so a broken pipeline is caught on the commit that broke it.
      - name: Smoke-test the experiment ladder
        run: python -m src.evaluation.run_ladder --dummy --out-dir /tmp/ladder

      # The faithfulness runner and the accuracy hand-off to Track C. Same
      # reasoning as the ladder: the plumbing is exercised on every commit so a
      # break surfaces now rather than in October on real checkpoints.
      - name: Smoke-test the faithfulness runner
        run: python -m src.evaluation.run_faithfulness --dummy --out-dir /tmp/faithfulness

      # The audit orchestrator -- the multi-model version of the ladder.
      - name: Smoke-test the audit grid
        run: python -m src.evaluation.run_audit --dummy --out-dir /tmp/audit

      # The training grid's preflight. Exercises the CLI path that decides
      # whether a week of HPC time is safe to spend, and reports the missing
      # split files while they are still missing. Exits 0 either way, so this
      # guards the code rather than the data.
      - name: Smoke-test the training-grid preflight
        run: python -m src.model.run_grid --preflight
